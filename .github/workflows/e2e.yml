name: E2E

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suites to run.
        required: true
        default: all
        type: choice
        options: [all, api, ui]
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_READ || secrets.GITHUB_TOKEN }}
      GoogleApiKey: ${{ secrets.GOOGLE_API_KEY }}
      Stripe__SecretKey: ${{ secrets.STRIPE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image access
        run: |
          docker pull ghcr.io/concertable/auth@sha256:b92399c92ddff69b7916935b0b7b31afb52460b3151997f60d32124c9ff70c2c
          docker pull ghcr.io/concertable/payment-web@sha256:df33de77f2d01558f9ffb3b0d1cc68ddcd26e41f6d54f65045caf3e466b4a775
          docker pull ghcr.io/concertable/payment-workers@sha256:4385c505153cca1df16983864b0c99807537b37f8aea801d434092cce47c87c8
          docker pull ghcr.io/concertable/search-web@sha256:5bfb93f03c875d2adb5bbd18499f2ff11ef9a71902cd7f62811cb0d7876976cb
          docker pull ghcr.io/concertable/search-workers@sha256:c0c7d64a4b2702a0186963472ab8bf4030c2cba873748eb8fdb6be9905c84d11
          docker pull ghcr.io/concertable/search-migrations@sha256:0ac571000b44f5683efa6890b23b9ef5d8b9e1cb5aa3461d314ececdccd453ea

      - name: Provision HTTPS dev certificate
        run: |
          dotnet dev-certs https --trust || true
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Install Stripe CLI
        uses: ./.github/actions/setup-stripe-cli

      - name: Install Azure Functions Core Tools
        run: |
          npm install -g azure-functions-core-tools@4.12.1 --unsafe-perm true
          func --version

      - name: Set up Node
        if: inputs.suite != 'api'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        if: inputs.suite != 'api'
        run: npm ci

      - name: Build frontend package dependencies
        if: inputs.suite != 'api'
        run: npm run build:shared

      - name: Require the credentials this suite cannot run without
        run: |
          test -n "$GITHUB_PACKAGES_TOKEN" || { echo '::error::CONCERTABLE_PACKAGES_READ is not set on this repository.'; exit 1; }
          test -n "$GoogleApiKey" || { echo '::error::GOOGLE_API_KEY is not set on this repository.'; exit 1; }
          test -n "$Stripe__SecretKey" || { echo '::error::STRIPE_SECRET_KEY is not set on this repository.'; exit 1; }

      - name: Generate service credentials
        run: |
          for name in ServiceAuth__B2BClientSecret ServiceAuth__CustomerClientSecret ServiceAuth__AuthClientSecret; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Restore
        run: dotnet restore Concertable.B2B.slnx

      - name: Build
        run: dotnet build Concertable.B2B.slnx --configuration Release --no-restore

      - name: Install Playwright
        if: inputs.suite != 'api'
        run: pwsh tests/E2ETests/Concertable.B2B.E2ETests.Ui/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run API E2E
        if: inputs.suite != 'ui'
        run: >-
          dotnet test tests/E2ETests/Concertable.B2B.E2ETests/Concertable.B2B.E2ETests.csproj
          --configuration Release -m:1 --logger "trx;LogFileName=e2e.trx"

      - name: Run UI E2E
        if: inputs.suite != 'api'
        run: >-
          dotnet test tests/E2ETests/Concertable.B2B.E2ETests.Ui/Concertable.B2B.E2ETests.Ui.csproj
          --configuration Release -m:1 --logger "trx;LogFileName=e2e.trx"

      - name: Retain the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b2b-e2e-results
          path: |
            **/TestResults/*.trx
            **/e2e-diagnostics.log
          if-no-files-found: warn
