name: E2E

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suites to run.
        required: true
        default: all
        type: choice
        options: [all, api, ui]
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_READ }}
      GoogleApiKey: ${{ secrets.GOOGLE_API_KEY }}
      Stripe__SecretKey: ${{ secrets.STRIPE_SECRET_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GITHUB_PACKAGES_TOKEN }}

      - name: Verify image access
        run: |
          docker pull ghcr.io/concertable/auth@sha256:cbd7c429da9d9dd2cc674177760690c53d1414e8057e368eefc3631dfcb62be6
          docker pull ghcr.io/concertable/auth-migrations@sha256:090b1bb80dc7b708508a03883cdfb8e8805b36918589e6d14f2f350cc61c5dcb
          docker pull ghcr.io/concertable/payment-web@sha256:67688d0d65f35cf15671ffbf5c65e68546e3189e59354b6b5ed34751fc1aa27c
          docker pull ghcr.io/concertable/payment-workers@sha256:5d46a8507f52538bb3454d2b646e8dc8ead0b8b0561c78d83bab32128e4d7d47
          docker pull ghcr.io/concertable/payment-migrations@sha256:b22e1a0d498e01d12b49e0bc911f3e4c7e44a0d5e3c4d5c8917e854e1fccdc96
          docker pull ghcr.io/concertable/search-web@sha256:f345c7e05209d4a72f7aee23f311867327fbc9b8b5daec7323506c3ef517d50a
          docker pull ghcr.io/concertable/search-workers@sha256:179918a414cb6aa398dc3ffd5035728a47d2780649b88c0b27468cdf71223515
          docker pull ghcr.io/concertable/search-migrations@sha256:351365915b0afbfd604db29d4dcff252b9bb8d2beeff3bd6d38392de176413b7

      - name: Provision HTTPS dev certificate
        run: |
          dotnet dev-certs https --trust || true
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Install Stripe CLI
        uses: ./.github/actions/setup-stripe-cli

      - name: Install Azure Functions Core Tools
        run: |
          npm install -g azure-functions-core-tools@4.12.1 --unsafe-perm true
          func --version

      - name: Set up Node
        if: inputs.suite != 'api'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        if: inputs.suite != 'api'
        run: npm ci

      - name: Build frontend package dependencies
        if: inputs.suite != 'api'
        run: npm run build:shared

      - name: Require the credentials this suite cannot run without
        run: |
          test -n "$GITHUB_PACKAGES_TOKEN" || { echo '::error::CONCERTABLE_PACKAGES_READ is not set on this repository.'; exit 1; }
          test -n "$GoogleApiKey" || { echo '::error::GOOGLE_API_KEY is not set on this repository.'; exit 1; }
          test -n "$Stripe__SecretKey" || { echo '::error::STRIPE_SECRET_KEY is not set on this repository.'; exit 1; }
          if [ '${{ inputs.suite }}' != 'api' ]; then
            test -n "$VITE_STRIPE_PUBLISHABLE_KEY" || { echo '::error::STRIPE_PUBLISHABLE_KEY is not set on this repository.'; exit 1; }
          fi

      - name: Generate service credentials
        run: |
          for name in ServiceAuth__B2BClientSecret ServiceAuth__CustomerClientSecret ServiceAuth__AuthClientSecret; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Restore
        run: dotnet restore Concertable.B2B.slnx

      - name: Build
        run: dotnet build Concertable.B2B.slnx --configuration Release --no-restore

      - name: Install Playwright
        if: inputs.suite != 'api'
        run: pwsh tests/E2ETests/Concertable.B2B.E2ETests.Ui/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run API E2E
        if: inputs.suite != 'ui'
        run: >-
          dotnet test tests/E2ETests/Concertable.B2B.E2ETests/Concertable.B2B.E2ETests.csproj
          --configuration Release -m:1 --logger "trx;LogFileName=e2e.trx"

      - name: Run UI E2E
        if: inputs.suite != 'api'
        run: >-
          dotnet test tests/E2ETests/Concertable.B2B.E2ETests.Ui/Concertable.B2B.E2ETests.Ui.csproj
          --configuration Release -m:1 --logger "trx;LogFileName=e2e.trx"

      - name: Retain the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b2b-e2e-results
          path: |
            **/TestResults/*.trx
            **/e2e-diagnostics.log
          if-no-files-found: warn
