<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820" role="img" aria-labelledby="title desc">
<title id="title">Capability selection and typed matching</title><desc id="desc">An operation can compose several configured step families. Shared generic factories select module-owned implementations using typed behaviour and version keys. The owning workflow matches different action contracts; a named calculation resolver matches calculation inputs. Same-contract variation stays a strategy.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1300" height="820" fill="#f8fafc"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:650}.head{font-size:20px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#475569}.link{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.ref{stroke-dasharray:7 5}.box{stroke:#94a3b8;stroke-width:1.5}</style>
<text x="40" y="40" class="title">Typed dispatch — where the matching belongs</text>
<rect x="45" y="95" width="340" height="140" rx="12" class="box" fill="#e0f2fe"/>
<text x="63" y="126" class="head">Configuration selection</text>
<text x="63" y="155" class="body">Behaviour enum + version</text>
<text x="63" y="180" class="body">Typed parameters and bindings</text>
<text x="63" y="205" class="body">Not TemplateId-driven switches</text>
<rect x="490" y="95" width="330" height="140" rx="12" class="box" fill="#ede9fe"/>
<text x="508" y="126" class="head">Shared generic factory</text>
<text x="508" y="155" class="body">Module-owned registrations</text>
<text x="508" y="180" class="body">Returns strategy or union arm</text>
<text x="508" y="205" class="body">Only this layer resolves keyed DI</text>
<rect x="925" y="95" width="330" height="140" rx="12" class="box" fill="#fef3c7"/>
<text x="943" y="126" class="head">Owning XWorkflow.cs</text>
<text x="943" y="155" class="body">Shared lifecycle checks</text>
<text x="943" y="180" class="body">Matches capability + command</text>
<text x="943" y="205" class="body">Owns transition and outbox</text>
<path d="M385 165 H490" class="link"/>
<path d="M820 165 H925" class="link"/>
<rect x="925" y="330" width="330" height="120" rx="12" class="box" fill="#fff"/>
<text x="943" y="361" class="head">Typed command</text>
<text x="943" y="390" class="body">Action-specific request body</text>
<text x="943" y="415" class="body">Controller/service forwards it</text>
<path d="M1090 330 V235" class="link"/>
<rect x="45" y="330" width="370" height="130" rx="12" class="box" fill="#dcfce7"/>
<text x="63" y="361" class="head">Same action contract</text>
<text x="63" y="390" class="body">Different calculation or collection</text>
<text x="63" y="415" class="body">Ordinary keyed strategy</text>
<text x="63" y="440" class="body">No new union arm</text>
<rect x="480" y="330" width="370" height="130" rx="12" class="box" fill="#ede9fe"/>
<text x="498" y="361" class="head">Different action contract</text>
<text x="498" y="390" class="body">Fixed vs receipt-based calculation</text>
<text x="498" y="415" class="body">Typed capability + required inputs</text>
<text x="498" y="440" class="body">Workflow or named resolver</text>
<path d="M650 235 V285 H235 V330" class="link"/>
<path d="M650 285 H665 V330" class="link"/>
<rect x="45" y="540" width="1210" height="185" rx="12" class="box" fill="#fff"/>
<text x="63" y="571" class="head">One operation can compose several step families</text>
<text x="63" y="600" class="body">Apply, Accept or Confirm: compose supported requirements/actions; keep mandatory lifecycle checks.</text>
<text x="63" y="625" class="body">New tenant template or parameter value: data only; no workflow branch or enum member.</text>
<text x="63" y="650" class="body">New behaviour, same contract: implementation + registration. New inputs/results: typed case + match + tests.</text>
<text x="63" y="675" class="body">Independent negotiated act: its own endpoint and durable fact, not an optional-field bag.</text>
<text x="45" y="778" class="small">Builders validate registrations; workflow pairing and configuration compatibility still need explicit tests.</text>
</svg>
